<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Lemon</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
 <header>
    <div>
      <img src="little-lemon-website-logo.png" alt="Little Lemon Logo" style="width: 420px; height: 360px;">
    </div>

    <h1>Flexbox Search Bar Example</h1>
    <form class="search-container" action="#" method="get">
      <img src="search.png" alt="searchlogo" style="width: 30px; height: 30px; margin-right: 10px;">
      <input type="search" class="search-box" placeholder="Search here..." name="search">
      <button type="submit" class="search-button">Search</button>
    </form>
 </header>
</body>
</html>
