<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Lemon Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    img {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      margin-bottom: 20px;
    }

    form {
      text-align: left;
    }

    div {
      margin-bottom: 10px;
    }

    label {
      display: inline-block;
      width: 90px;
      font-size: 16px;
    }

    input {
      padding: 5px;
      font-size: 14px;
    }

    button {
      display: block;
      margin: 0 auto;
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Logo -->
  <img src="little-lemon-website-logo.png" alt="Little Lemon Logo">

  <!-- Login Form -->
  <form>
    <div>
      <label for="username">Username:</label>
      <input 
        type="text" 
        id="username" 
        name="username" 
        required 
        minlength="2">
    </div>

    <div>
      <label for="password">Password:</label>
      <input 
        type="password" 
        id="password" 
        name="password" 
        required 
        minlength="2">
    </div>

    <button type="submit">Log In</button>
  </form>
</body>
</html>
